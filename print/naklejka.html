<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8"><title>Наклейкалар · Гаметогенез</title>
<link href="../vendor/golos.css" rel="stylesheet">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}body{margin:0;font-family:'Golos Text',Arial,sans-serif;color:#10233F;-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#ccc}
.pg{width:210mm;height:297mm;background:#fff;margin:0 auto 6mm;padding:10mm 10mm 8mm;position:relative;overflow:hidden;page-break-after:always}
@media print{body{background:#fff}.pg{margin:0}}
.hd{display:flex;align-items:center;gap:4mm;margin-bottom:5mm}
.hd b{font-size:17pt;font-weight:900;background:linear-gradient(90deg,#08795F,#1F4FD8 55%,#C2186E);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd small{display:block;font-size:8.5pt;color:#4F6480;font-weight:600}
.hd .n{width:11mm;height:11mm;border-radius:50%;background:linear-gradient(135deg,#00B386,#3B5BFF);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:12pt;flex:none}
.foot{position:absolute;left:10mm;right:10mm;bottom:5mm;font-size:7.5pt;color:#7A8BA6;display:flex;justify-content:space-between}
.grid{display:grid;gap:4mm;justify-content:center}
.cut{outline:0.3mm dashed #B8C4D6;outline-offset:1.2mm}
/* рөл белгісі */
.badge{width:60mm;height:60mm;border-radius:50%;padding:3mm;display:flex}
.badge .in{flex:1;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3mm}
.badge svg{width:19mm;height:19mm}
.badge b{font-size:14pt;font-weight:900;line-height:1.05;margin-top:1mm}
.badge small{font-size:7.5pt;font-weight:700;opacity:.85;line-height:1.15;margin-top:1mm}
/* тақтайша */
.tent{height:88mm;border-radius:5mm;display:grid;grid-template-rows:1fr 1fr;overflow:hidden}
.tent>div{display:flex;align-items:center;gap:6mm;padding:0 10mm;color:#fff}
.tent>div:first-child{transform:rotate(180deg);border-bottom:0.4mm dashed rgba(255,255,255,.6)}
.tent svg{width:26mm;height:26mm;flex:none;background:rgba(255,255,255,.95);border-radius:50%;padding:2.5mm}
.tent b{font-size:23pt;font-weight:900;display:block;line-height:1.05}
.tent small{font-size:10pt;font-weight:700;opacity:.9}
/* капсула */
.cap{width:90mm;height:30mm;border-radius:15mm;display:flex;overflow:hidden;border:0.6mm solid}
.cap .l{width:34mm;display:flex;align-items:center;justify-content:center;gap:1.5mm;color:#fff;font-weight:900;font-size:10pt;text-align:center;line-height:1.1;padding:0 2mm}
.cap .l svg{width:9mm;height:9mm;flex:none;background:#fff;border-radius:50%;padding:1mm}
.cap .r{flex:1;background:#fff;padding:3mm 5mm;font-size:8.5pt;font-weight:700;display:flex;flex-direction:column;justify-content:center;gap:2.5mm}
/* жұлдыз/тілек */
.wish{width:58mm;height:46mm;border-radius:7mm;padding:2.5mm 3mm;display:flex;flex-direction:column;align-items:center;border:0.6mm solid}
.wish svg{width:13mm;height:13mm}
.wish b{font-size:10.5pt;font-weight:900;margin:.5mm 0 1mm}
.wish i{display:block;width:100%;border-bottom:0.3mm solid #C8D2E2;height:5.6mm}
/* көңіл-күй */
.mood{width:42mm;height:42mm;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1mm solid;background:#fff}
.mood span{font-size:26pt;line-height:1}
.mood b{font-size:9pt;font-weight:800;margin-top:1mm;text-align:center}
.lvl{width:60mm;height:38mm;border-radius:6mm;padding:3mm 4mm;color:#fff;display:flex;flex-direction:column;justify-content:center}
.lvl b{font-size:12pt;font-weight:900;line-height:1.1}
.lvl small{font-size:7.5pt;font-weight:600;opacity:.95;margin-top:1.5mm;line-height:1.25}
/* медаль */
.med{width:60mm;height:60mm;border-radius:50%;padding:2.5mm;display:flex}
.med .in{flex:1;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff,#FFF8E1);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4mm;border:0.8mm dashed rgba(0,0,0,.15)}
.med svg{width:17mm;height:17mm}
.med b{font-size:12pt;font-weight:900;line-height:1.05;margin-top:1mm}
.med small{font-size:8pt;font-weight:700;color:#4F6480;margin-top:1mm}
</style></head><body>
<div id="root"></div>
<script src="../lesson-data.js"></script><script src="icons.js"></script>
<script>
const LD = window.LD, IC = window.IC;
const G = LD.groups, GI = [IC.sperm, IC.egg, IC.chrom];
const roleIc = { sp1: IC.mic, sp2: IC.mic, hat: IC.book, pos: IC.poster };
const foot = (n) => `<div class="foot"><span>${LD.lesson.subject} · ${LD.lesson.grade} · ${LD.lesson.topic}</span><span>Наклейка парағы ${n}/6 · ${LD.lesson.teacher}</span></div>`;
const hd = (n, t, s) => `<div class="hd"><div class="n">${n}</div><div><b>${t}</b><small>${s}</small></div></div>`;
let h = '';
/* 1. Рөл белгілері */
h += `<div class="pg">${hd(1, 'Рөл белгілері', 'Әр топқа 4 рөл: 1-спикер, 2-спикер, хатшы, постер қорғаушы. Қиып алып, кеудеге жапсырыңыз.')}<div class="grid" style="grid-template-columns:repeat(3,60mm)">`;
G.forEach((g, gi) => LD.roles.forEach((r) => { h += `<div class="badge cut" style="background:conic-gradient(${g.c},${g.ink},${g.c})"><div class="in">${roleIc[r.key](g.c)}<b style="color:${g.ink}">${r.name}</b><small style="color:${g.ink}">${g.short} · ${g.name}</small></div></div>`; }));
h += `</div>${foot(1)}</div>`;
/* 2. Үстел тақтайшалары */
h += `<div class="pg">${hd(2, 'Топ тақтайшалары (үстелге)', 'Ортасынан бүктеңіз — екі жағынан да оқылады.')}<div class="grid" style="grid-template-columns:190mm">`;
G.forEach((g, gi) => { const side = `<div style="background:linear-gradient(120deg,${g.c},${g.ink})">${GI[gi](g.c)}<div><small>${g.short} · 11-сынып · Гаметогенез</small><b>${g.name}</b><small>${LD.posters[gi].name}</small></div></div>`; h += `<div class="tent cut">${side}${side}</div>`; });
h += `</div>${foot(2)}</div>`;
/* 3. Капсулалар */
h += `<div class="pg">${hd(3, '«Капсулалар» — топқа бөлу карточкалары', 'Сайт бөлген топтарға сай таратыңыз: әр топқа 5 капсула. Оқушы өз атын жазады.')}<div class="grid" style="grid-template-columns:repeat(2,90mm);row-gap:4.5mm">`;
G.forEach((g, gi) => { for (let k = 0; k < 5; k++) h += `<div class="cap cut" style="border-color:${g.c}"><div class="l" style="background:${g.c}">${GI[gi](g.c)}<span>${g.short}<br>${g.name.replace(' зертханасы', '')}</span></div><div class="r"><span>Аты-жөні: __________________</span><span>Рөлі: ______________________</span></div></div>`; });
h += `<div class="cap cut" style="border-color:#B6E31E"><div class="l" style="background:#7BC800">${IC.dna('#00B386', '#E0398C')}<span>Қосымша</span></div><div class="r"><span>Аты-жөні: __________________</span><span>Тобы: ______________________</span></div></div>`;
h += `</div>${foot(3)}</div>`;
/* 4. 2 жұлдыз, 1 тілек */
h += `<div class="pg">${hd(4, '«2 жұлдыз, 1 тілек» — галерея қорғау', 'Әр топ басқа топтың постеріне 2 жұлдыз (не жақсы?) және 1 тілек (не жетілдіру керек?) жапсырады.')}<div class="grid" style="grid-template-columns:repeat(3,58mm);row-gap:5mm">`;
for (let k = 0; k < 5; k++) {
  const g = G[k % 3];
  h += `<div class="wish cut" style="border-color:#F2B705;background:#FFFBEA">${IC.star('#F2B705')}<b>★ 1-жұлдыз</b><i></i><i></i><i></i></div>`;
  h += `<div class="wish cut" style="border-color:#F2B705;background:#FFFBEA">${IC.star('#FF9F1C')}<b>★ 2-жұлдыз</b><i></i><i></i><i></i></div>`;
  h += `<div class="wish cut" style="border-color:#00B4D8;background:#E8FAFF">${IC.bulb('#00B4D8')}<b>💡 Тілек</b><i></i><i></i><i></i></div>`;
}
h += `</div>${foot(4)}</div>`;
/* 5. Көңіл-күй және түсіну деңгейі */
const moods = [['🤩', 'Шабыттымын', '#00B386'], ['🙂', 'Жақсы', '#3B5BFF'], ['🤔', 'Ойланып тұрмын', '#F2994A'], ['😴', 'Шаршадым', '#7A3CFF']];
h += `<div class="pg">${hd(5, 'Көңіл-күй және «Гаметогенезді түсіну деңгейім»', 'Сабақ басында — көңіл-күй, соңында — түсіну деңгейі (телефонсыз нұсқа).')}<div class="grid" style="grid-template-columns:repeat(4,42mm)">`;
for (let r = 0; r < 3; r++) moods.forEach((m) => { h += `<div class="mood cut" style="border-color:${m[2]}"><span>${m[0]}</span><b style="color:${m[2]}">${m[1]}</b></div>`; });
h += `</div><div class="grid" style="grid-template-columns:repeat(3,60mm);margin-top:7mm">`;
const lc = ['#F2994A', '#3B5BFF', '#00B386'];
for (let r = 0; r < 3; r++) LD.feedback.forEach((f, i) => { h += `<div class="lvl cut" style="background:linear-gradient(135deg,${lc[i]},${['#C2186E', '#173B9A', '#0B6E58'][i]})"><b>${f.icon} ${f.t}</b><small>${f.d}</small></div>`; });
h += `</div>${foot(5)}</div>`;
/* 6. Медальдар */
const meds = [['Гаметогенез сарапшысы', '8–10 балл', '#F2B705'], ['Белсенді зерттеуші', '4–7 балл', '#00B4D8'], ['Ізденуші биолог', '1–3 балл', '#00B386'], ['Үздік спикер', '🎤 6 спикер', '#E0398C'], ['Үздік хатшы', '📒 әділ бағалау', '#7A3CFF'], ['Үздік постер', '🖼 консилиум', '#FF7A59']];
h += `<div class="pg">${hd(6, 'Медаль наклейкалары', 'Сабақ соңында 10 балдық рейтинг бойынша және үздік рөлдерге беріледі.')}<div class="grid" style="grid-template-columns:repeat(3,60mm)">`;
for (let r = 0; r < 2; r++) meds.forEach((m) => { h += `<div class="med cut" style="background:conic-gradient(${m[2]},#fff 25%,${m[2]} 50%,#fff 75%,${m[2]})"><div class="in">${IC.medal(m[2])}<b>${m[0]}</b><small>${m[1]} · ${LD.lesson.grade}</small></div></div>`; });
h += `</div>${foot(6)}</div>`;
document.getElementById('root').innerHTML = h;
</script></body></html>
