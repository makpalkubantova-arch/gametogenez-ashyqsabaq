<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Гаметогенез — ашық сабақ · 11-сынып биология</title>
<link href="vendor/golos.css" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
:root{--ink:#10233F;--mut:#4F6480;--line:#DCEBEA;--em:#00B386;--tl:#00B4D8;--mg:#E0398C;--cb:#2563EB;--lm:#B6E31E;--vi:#7A3CFF;--cr:#FF7A59;--dk:#063D3A;--ok:#0FA968;--bad:#D64545}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B1A2E;font-family:'Golos Text','Segoe UI',Arial,sans-serif;color:var(--ink);overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1920px;height:1080px;position:relative;transform-origin:center center;overflow:hidden;flex:none;background:linear-gradient(135deg,#ECFFF7 0%,#E8F6FF 40%,#F5EDFF 72%,#FFEDF5 100%)}
#bio{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#bio i{position:absolute;border-radius:50%;opacity:.35;animation:drift 28s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-24px)}}
header{position:absolute;left:0;right:0;top:0;height:100px;display:flex;align-items:center;gap:20px;padding:0 32px;z-index:20}
.num{flex:none;width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--em),var(--cb));color:#fff;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(0,120,140,.25)}
.ttl{flex:1;min-width:0}
.ttl small{display:block;font-size:18px;color:var(--mut);font-weight:700;letter-spacing:.3px}
.ttl b{display:block;font-size:40px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,#08795F,#1F4FD8 55%,#C2186E);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
#ribbon{display:flex;gap:10px}
#ribbon span{display:flex;align-items:center;gap:8px;border-radius:16px;padding:8px 14px;font-size:20px;font-weight:800;color:#fff;min-width:118px;justify-content:space-between}
#ribbon b{font-size:26px}
#timer{display:flex;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:6px 8px 6px 18px;box-shadow:0 8px 22px rgba(16,35,63,.1)}
#tval{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;min-width:150px;text-align:center;color:var(--ink)}
#timer.low #tval{color:var(--bad)}
#timer.run{box-shadow:0 0 0 4px rgba(0,179,134,.35),0 8px 22px rgba(16,35,63,.1)}
.tb{width:50px;height:50px;border-radius:14px;border:0;background:#EAF8F3;font-size:22px;cursor:pointer;font-family:inherit;font-weight:900;color:var(--ink)}
#tplay{background:linear-gradient(135deg,var(--em),var(--tl));color:#fff}
#method{position:absolute;left:32px;right:32px;top:110px;height:84px;z-index:10;display:flex;align-items:center;gap:16px;background:#fff;border-radius:24px;padding:0 22px;box-shadow:0 10px 26px rgba(16,35,63,.07)}
#method .lab{flex:none;background:linear-gradient(135deg,#0B6E58,#1A4FB8);color:#fff;border-radius:14px;padding:10px 14px;font-weight:900;font-size:18px;letter-spacing:1px}
#method .nm{font-size:32px;font-weight:900;color:#0B6E58;white-space:nowrap}
#method .es{font-size:23px;color:var(--mut);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;font-size:19px;font-weight:800;background:#EEF3FA;color:var(--ink);white-space:nowrap}
.chip.k{background:#FFF1DA;color:#8C4A12;cursor:pointer}
.chip.sh{background:#E9E3FF;color:#4B2BA8}
#body{position:absolute;left:32px;right:32px;top:210px;bottom:96px;display:grid;grid-template-columns:430px 1fr;gap:26px;z-index:5}
.how{background:linear-gradient(160deg,#0B5E58,#123E8C);color:#fff;border-radius:28px;padding:24px 24px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 30px rgba(11,94,88,.25);min-height:0;overflow:hidden}
.how h3{margin:0;font-size:22px;letter-spacing:1px;color:var(--lm)}
.how ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.how li{display:flex;gap:12px;font-size:25px;line-height:1.28;font-weight:600}
.how li b{flex:none;width:42px;height:42px;border-radius:50%;background:#fff;color:#0B5E58;font-size:21px;display:flex;align-items:center;justify-content:center}
.say{margin-top:auto;background:rgba(255,255,255,.12);border:2px dashed rgba(182,227,30,.6);border-radius:18px;padding:12px 14px;font-size:19px;line-height:1.35}
.say h4{margin:0 0 4px;color:var(--lm);font-size:16px;letter-spacing:1px}
.say i{display:block;font-style:normal}
.task{position:relative;min-height:0;animation:zin .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes zin{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.card{background:rgba(255,255,255,.95);border-radius:26px;box-shadow:0 14px 32px rgba(16,35,63,.08);padding:24px 28px;position:relative}
.mut{color:var(--mut)}
.btn{border:0;border-radius:16px;padding:14px 22px;font-size:22px;font-weight:800;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,var(--em),#00A3C4);color:#fff;box-shadow:0 8px 18px rgba(0,163,150,.25)}
.btn.sec{background:#EAF8F3;color:var(--ink);box-shadow:none}
.btn.pink{background:linear-gradient(135deg,var(--mg),var(--cr))}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:24px}
table.t th{background:linear-gradient(90deg,#0B5E58,#1A4FB8);color:#fff;text-align:left;padding:12px 16px}
table.t th:first-child{border-top-left-radius:16px}table.t th:last-child{border-top-right-radius:16px}
table.t td{padding:13px 16px;border-bottom:1px solid var(--line);background:#fff;vertical-align:middle}
.key{display:none}.showkey .key{display:inline}.showkey .nokey{display:none}
footer{position:absolute;left:0;right:0;bottom:0;height:88px;display:flex;align-items:center;gap:14px;padding:0 24px 0 18px;z-index:30}
#prog{flex:1;display:flex;gap:6px;height:52px}
#prog i{flex:1;border-radius:12px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px;cursor:pointer;position:relative;border:2px solid transparent;transition:.2s}
#prog i.done{background:#D9F5EC}
#prog i.on{background:#fff;border-color:var(--em);box-shadow:0 6px 16px rgba(0,179,134,.25);transform:translateY(-3px)}
#prog i small{position:absolute;bottom:0;right:6px;font-size:12px;color:var(--mut);font-weight:800}
.fb{height:56px;min-width:56px;border-radius:16px;border:0;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 6px 14px rgba(16,35,63,.1);font-family:inherit;font-weight:800;color:var(--ink);padding:0 12px}
.fb.nav{background:linear-gradient(135deg,#0B6E58,#1A4FB8);color:#fff;min-width:72px;font-size:28px}
#gmed{width:72px;height:72px;flex:none;cursor:pointer;filter:drop-shadow(0 6px 10px rgba(16,35,63,.25))}
#bub{position:absolute;left:100px;bottom:96px;z-index:40;max-width:820px;background:#fff;border:3px solid #E5C76B;border-radius:24px 24px 24px 6px;padding:16px 22px;font-size:25px;line-height:1.35;box-shadow:0 16px 34px rgba(16,35,63,.2);transform-origin:left bottom;transition:.4s cubic-bezier(.2,.8,.2,1);opacity:0;transform:scale(.6);pointer-events:none}
#bub.on{opacity:1;transform:none}
#bub b{display:block;font-size:16px;color:#9A7A1A;letter-spacing:.5px}
.eye{animation:blink 4.2s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.mouth{transform-origin:center;transform-box:fill-box}
.talk .mouth{animation:talk .22s infinite alternate}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.5)}}
.ov{position:absolute;inset:0;z-index:60;background:rgba(6,20,40,.55);display:none}
.ov.on{display:block}
.drawer{position:absolute;top:0;right:0;bottom:0;width:880px;background:#fff;padding:28px 32px;overflow:auto;font-size:21px;animation:slide .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.drawer h2,.full h2{margin:0 0 10px;font-size:32px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.tabs button{border:0;border-radius:12px;padding:10px 16px;font-size:19px;font-weight:800;font-family:inherit;cursor:pointer;background:#EEF3FA;color:var(--ink)}
.tabs button.on{background:linear-gradient(135deg,#0B6E58,#1A4FB8);color:#fff}
.full{position:absolute;inset:36px;background:#fff;border-radius:32px;padding:30px 36px;overflow:auto;animation:zin .4s both}
.x{position:absolute;right:22px;top:18px;width:52px;height:52px;border-radius:50%;border:0;background:#EEF3FA;font-size:24px;cursor:pointer;z-index:3}
#banner{position:absolute;top:110px;left:50%;transform:translate(-50%,-240px);z-index:70;background:linear-gradient(90deg,#FF7A59,#E0398C);color:#fff;font-size:32px;font-weight:900;padding:16px 34px;border-radius:20px;box-shadow:0 14px 30px rgba(0,0,0,.2);transition:.4s;white-space:nowrap}
#banner.on{transform:translate(-50%,0)}
#count{position:absolute;inset:0;z-index:65;display:none;align-items:center;justify-content:center;pointer-events:none}
#count.on{display:flex}
#count span{font-size:400px;font-weight:900;color:rgba(214,69,69,.8);animation:pop 1s ease-out}
@keyframes pop{from{transform:scale(1.5);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:.8}}
.qrbox{background:#fff;border-radius:20px;padding:10px;display:inline-block}
.qrbox svg{display:block;width:100%;height:100%}
.lv{font-weight:900;border-radius:8px;padding:0 8px;font-size:17px}
.lvA{background:#E1F5EC;color:#11634C}.lvB{background:#FFF1DD;color:#8C4A12}.lvC{background:#FDE4E4;color:#8E2424}
.bar{height:14px;border-radius:8px;background:#E7EBF4;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--em),var(--tl),var(--mg));transition:width .5s}
.anim .cellin{animation:cellIn .7s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}
@keyframes cellIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.swim{animation:swim 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes swim{50%{transform:translateX(6px) rotate(2deg)}}
.lab3d{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#0E4A5C,#071C2B 70%)}
.l3ui{position:absolute;left:20px;top:20px;display:flex;gap:10px;flex-wrap:wrap;z-index:3}
.l3ui button{border:0;border-radius:14px;padding:12px 18px;font-size:21px;font-weight:800;font-family:inherit;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.l3ui button.on{background:#fff;color:#14213D}
.l3z{position:absolute;right:20px;top:90px;display:flex;flex-direction:column;gap:10px;z-index:3}
.l3z button{width:62px;height:62px;border-radius:16px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:32px;font-weight:900;cursor:pointer}
.l3lab{position:absolute;z-index:2;color:#fff;font-size:20px;font-weight:700;background:rgba(14,20,38,.7);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:4px 10px;white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%)}
.l3cap{position:absolute;left:20px;bottom:20px;right:20px;z-index:3;color:#fff;font-size:22px;background:rgba(14,20,38,.55);border-radius:16px;padding:12px 18px}
.zoomable{cursor:zoom-in}
#vbox svg,.zoomable svg{width:100%;height:100%;display:block}
.btn:disabled{opacity:.4;cursor:default;filter:grayscale(.4)}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="bio"><i style="left:-90px;top:640px;width:300px;height:300px;background:radial-gradient(circle at 40% 35%,#C9FFE9,#00B386 75%)"></i><i style="left:1560px;top:-110px;width:260px;height:260px;background:radial-gradient(circle at 40% 35%,#FFE0EF,#E0398C 78%);animation-delay:-9s"></i><i style="left:900px;top:930px;width:180px;height:180px;background:radial-gradient(circle at 40% 35%,#E2ECFF,#2563EB 80%);animation-delay:-4s"></i></div>
  <header>
    <div class="num" id="num">1</div>
    <div class="ttl"><small id="sub">Биология · 11-сынып · Гаметогенез</small><b id="title">…</b></div>
    <div id="ribbon"></div>
    <div id="timer"><span id="tval">00:00</span><button class="tb" id="tplay" title="Бастау / тоқтату (Space)">▶</button><button class="tb" id="treset" title="Қайта">↺</button><button class="tb" id="tplus" title="+1 минут">+1</button></div>
  </header>
  <div id="method"></div>
  <div id="body"></div>
  <footer>
    <svg id="gmed" viewBox="0 0 150 150" aria-label="Гид">
      <defs><radialGradient id="gold" cx="35%" cy="30%"><stop offset="0" stop-color="#FFF2B8"/><stop offset=".6" stop-color="#E2B84B"/><stop offset="1" stop-color="#9E7618"/></radialGradient><clipPath id="gc"><circle cx="75" cy="75" r="60"/></clipPath></defs>
      <circle cx="75" cy="75" r="72" fill="url(#gold)"/><circle cx="75" cy="75" r="62" fill="#F4ECDA" stroke="#8C6A14" stroke-width="2"/>
      <g clip-path="url(#gc)"><rect width="150" height="150" fill="#E8DCC0"/><path d="M18 150 Q24 104 75 100 Q126 104 132 150Z" fill="#2B2A33"/><path d="M60 104 Q75 126 90 104 L86 132 Q75 138 64 132Z" fill="#fff"/>
        <path d="M34 112 Q22 70 44 42 Q75 18 106 42 Q128 70 116 112 Q108 120 100 104 L100 64 Q75 54 50 64 L50 104 Q42 120 34 112Z" fill="#6B4A2E"/>
        <g fill="#7E5838"><circle cx="38" cy="96" r="9"/><circle cx="35" cy="80" r="9"/><circle cx="39" cy="64" r="9"/><circle cx="112" cy="96" r="9"/><circle cx="115" cy="80" r="9"/><circle cx="111" cy="64" r="9"/></g>
        <ellipse cx="75" cy="76" rx="25" ry="30" fill="#F2C9A5"/><path d="M50 62 Q75 40 100 62 Q90 50 75 50 Q60 50 50 62Z" fill="#6B4A2E"/>
        <g class="eye"><ellipse cx="65" cy="74" rx="3.4" ry="3.8" fill="#2B2A33"/></g><g class="eye"><ellipse cx="85" cy="74" rx="3.4" ry="3.8" fill="#2B2A33"/></g>
        <path d="M68 91 q7 -3 14 0" stroke="#6B4A2E" stroke-width="2.5" fill="none"/><ellipse class="mouth" cx="75" cy="95" rx="5" ry="2.6" fill="#9C4A42"/></g>
    </svg>
    <div id="prog"></div>
    <button class="fb" id="bScript" title="Мұғалім сөзі (M)">💬</button>
    <button class="fb" id="bAssess" title="Бағалау: критерий, дескриптор, нәтиже (B)">📋</button>
    <button class="fb" id="bRate" title="Рейтинг (R)">🏅</button>
    <button class="fb" id="bMat" title="Материалдар">📁</button>
    <button class="fb" id="bSet" title="Баптау: тізім, сілтемелер, бейне (T)">⚙️</button>
    <button class="fb nav" id="bp" title="Алдыңғы (←)">◀</button><button class="fb nav" id="bn" title="Келесі (→)">▶</button>
  </footer>
  <div id="bub"><b>🔬 ГИД · АНТОНИ ВАН ЛЕВЕНГУК</b><span id="gtext"></span></div>
  <div id="banner"></div>
  <div id="count"><span id="cnum">10</span></div>
  <div class="ov" id="ov"></div>
</div></div>
<script src="lesson-data.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="core.js"></script>
<script src="viz.js"></script>
<script src="app.js"></script>
</body>
</html>
