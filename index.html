<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>§27. Сперматогенез бен оогенездің айырмашылықтары — сабақ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0d1424;--ink2:#344057;--muted:#667085;--line:#e3e7ef;
--sp:#2f7ff0;--sp-s:#e8f1fe;--oo:#e09a1c;--oo-s:#fdf3df;--ac:#4f46e5;--ac-s:#eef0ff;--ok:#16a34a;--ok-s:#e7f7ee;--bad:#dc2626;--bad-s:#fdecec;
--b1:#0ea5e9;--b2:#8b5cf6;--b3:#f59e0b}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
/* top */
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:0 18px;height:58px;flex:0 0 auto}
.top .ttl{font-weight:700;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:10px}
.top .ttl i{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--sp),var(--oo))}
.stages{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.stg{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.06);white-space:nowrap}
.stg b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#aab4c8;margin-right:2px}
.stg.on b{color:#fff}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.22);border:none;padding:0}
.dot.on{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.dot.done{background:#7c8aa5}
.tbtn{background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.18)}
/* main */
main{flex:1;overflow:auto;padding:24px 28px}
.screen{max-width:1400px;margin:0 auto;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.kicker{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:7px;background:var(--ac-s);color:var(--ac)}
.pill.s1{background:#e0f2fe;color:#0369a1}.pill.s2{background:#ede9fe;color:#6d28d9}.pill.s3{background:#fef3c7;color:#b45309}
.pill.min{background:#fff;border:1px solid var(--line);color:var(--ink2)}
h1{font-size:36px;line-height:1.15;margin:8px 0 0;letter-spacing:-.02em}
h2{font-size:22px;margin:0 0 10px}
h3{font-size:18px;margin:0 0 6px}
.lead{color:var(--muted);margin:6px 0 0;max-width:760px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 16px;font-weight:600;font-size:16px}
.btn:hover{border-color:#c5cbd8}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{font-size:14px;padding:7px 12px}
/* timer */
.timer{text-align:center;background:var(--ink);color:#fff;border:none}
.timer .lbl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#9fb0cc;font-weight:700}
.timer .ws{display:inline-block;margin-top:6px;font-size:14px;font-weight:700;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:8px}
.clock{font-size:76px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.05;margin:10px 0 6px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#60a5fa);transition:width .3s linear}
.timer.warn .clock{color:#fbbf24}.timer.end .clock{color:#f87171;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.timer .ctl{display:flex;gap:8px;justify-content:center}
.timer .ctl button{border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;background:rgba(255,255,255,.12);color:#fff}
.timer .ctl button.go{background:#fff;color:var(--ink)}
.who{display:flex;gap:12px;align-items:flex-start}
.who .ic{font-size:26px;line-height:1}
.who b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.desc ul{margin:6px 0 0;padding:0;list-style:none}
.desc li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:16px;cursor:pointer;user-select:none}
.desc li:last-child{border-bottom:none}
.desc li .cb{flex:0 0 20px;height:20px;border:2px solid #b8c0d0;border-radius:6px;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.desc li.on .cb{background:var(--ok);border-color:var(--ok)}
.desc li .pt{margin-left:auto;font-weight:700;color:var(--muted);white-space:nowrap}
/* reveal */
.rv{display:none;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--ok-s);color:#14532d;font-size:16.5px}
.open .rv{display:block}
.qc{display:flex;flex-direction:column}
.qc .n{font-size:30px;font-weight:800;color:#cfd5e2;line-height:1}
.qc p{font-weight:600;margin:10px 0 12px;flex:1;font-size:19px}
/* table */
table.t{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;font-size:17px}
table.t th,table.t td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t tr:last-child td{border-bottom:none}
table.t thead th{background:var(--ink);color:#fff;font-weight:600}
table.t td.h{cursor:pointer;color:transparent;background:repeating-linear-gradient(135deg,#f3f5f9,#f3f5f9 8px,#eceff5 8px,#eceff5 16px);position:relative;user-select:none}
table.t td.h::after{content:"басу";position:absolute;left:14px;top:12px;color:#9aa3b5;font-size:14px}
table.t td.h.s{color:inherit;background:#fff}table.t td.h.s::after{content:""}
table.t td.sp{background:#f7faff}table.t td.oo{background:#fffaf0}
/* tf */
.tf{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.tf:last-child{border-bottom:none}
.tf .i{width:34px;height:34px;border-radius:9px;background:#eef1f6;font-weight:800;display:flex;align-items:center;justify-content:center}
.tf .a{display:flex;gap:6px}
.tf .fx{grid-column:2/4;display:none;padding:10px 12px;border-radius:10px;font-size:16.5px}
.tf.d .fx{display:block}.tf.ok .i{background:var(--ok);color:#fff}.tf.no .i{background:var(--bad);color:#fff}
.tf.ok .fx{background:var(--ok-s);color:#14532d}.tf.no .fx{background:var(--bad-s);color:#7f1d1d}
/* groups */
.grp{border-top:5px solid var(--g)}
.grp .gl{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--g)}
.grp .rq{background:var(--bg);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:16.5px}
/* quiz */
.qz{background:var(--ink);color:#fff;border-radius:20px;padding:28px}
.qz .qh{display:flex;justify-content:space-between;align-items:center;color:#9fb0cc;font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.qz .qq{font-size:32px;font-weight:700;line-height:1.25;margin:18px 0 22px;min-height:80px}
.qz .ops{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qz .op{border:none;border-radius:14px;padding:20px;font-size:22px;font-weight:700;color:#fff;text-align:left;display:flex;gap:12px;align-items:center;transition:.2s}
.qz .op span{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 34px}
.qz .op:nth-child(1){background:#e11d48}.qz .op:nth-child(2){background:#2563eb}.qz .op:nth-child(3){background:#d97706}.qz .op:nth-child(4){background:#16a34a}
.qz.shown .op{opacity:.28}.qz.shown .op.c{opacity:1;box-shadow:0 0 0 4px #fff}
.qz .qt{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff}
.qz .qbar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:16px;overflow:hidden}.qz .qbar i{display:block;height:100%;background:#fbbf24}
/* board score */
table.sc td,table.sc th{text-align:center;white-space:nowrap}
table.sc td:first-child,table.sc th:first-child{text-align:left}
.cellb{min-width:46px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;font-weight:800;font-size:17px}
.minus{border:none;background:none;color:var(--muted);padding:2px 5px;font-size:18px}
.tot{font-size:24px;font-weight:800}
tr.lead td{background:#fffbeb}
/* plan */
.plan a{display:grid;grid-template-columns:96px 1fr 70px;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.plan a:hover{background:var(--bg)}
.plan .tm{font-family:ui-monospace,monospace;font-size:15px;color:var(--muted)}
.plan .mm{text-align:right;font-weight:700}
.plan .st{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-right:8px}
/* video & 3d */
.vid{border-radius:18px;overflow:hidden;background:#000;box-shadow:0 20px 60px rgba(13,20,36,.25)}
.vid video{display:block;width:100%;aspect-ratio:16/9}
#v3d{position:relative;height:min(68vh,640px);border-radius:18px;overflow:hidden;background:radial-gradient(800px 500px at 30% 30%,#13284f,transparent 60%),radial-gradient(700px 500px at 80% 75%,#2d1c08,transparent 60%),#060912}
#v3d canvas{display:block;width:100%;height:100%;touch-action:none}
#v3d .hint{position:absolute;left:16px;bottom:14px;color:#9fb0cc;font-size:14px}
#v3d .lab{position:absolute;color:#fff;font-size:15px;font-weight:700;background:rgba(5,8,18,.75);border:1px solid rgba(255,255,255,.18);padding:4px 10px;border-radius:8px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-50%)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* reflection */
.lights{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.light{border:1px solid var(--line);border-radius:16px;padding:22px;background:#fff;cursor:pointer;user-select:none}
.light:active{transform:scale(.98)}
.light .bl{width:26px;height:26px;border-radius:50%;margin-bottom:12px}
.light .c{font-size:44px;font-weight:800}
/* bottom nav */
.nav{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:#fff;border-top:1px solid var(--line)}
.nav .mid{color:var(--muted);font-size:15px;text-align:center}
.nav .mid b{color:var(--ink)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(13,20,36,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:86vh;overflow:auto;padding:26px;position:relative}
.modal .x{position:absolute;right:14px;top:12px;border:none;background:#f1f3f7;border-radius:9px;width:36px;height:36px;font-size:20px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.split div{border-radius:10px;padding:10px 12px;font-size:16px}
.split .a{background:var(--sp-s)}.split .b{background:var(--oo-s)}
.split b{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.split .a b{color:var(--sp)}.split .b b{color:#a16207}
.blank{display:inline-block;min-width:120px;border-bottom:2px solid var(--ink2);text-align:center;font-weight:700;margin:0 4px;cursor:pointer}
.word{border:1px dashed #b4bccc;background:#fff;border-radius:9px;padding:6px 14px;margin:4px;font-weight:600}
.word.u{opacity:.3;pointer-events:none}
.mc{display:flex;gap:8px;margin:8px 0 14px}
.mc .ok{background:var(--ok);color:#fff;border-color:var(--ok)}.mc .no{background:var(--bad);color:#fff;border-color:var(--bad)}
@media (max-width:1100px){.layout{grid-template-columns:1fr}.side{position:static}.g4{grid-template-columns:1fr 1fr}}
@media (max-width:700px){main{padding:16px}h1{font-size:26px}.g2,.g3,.g4,.lights,.split,.qz .ops{grid-template-columns:1fr}.top .ttl span{display:none}.qz .qq{font-size:24px}.clock{font-size:60px}.tf{grid-template-columns:34px 1fr}.tf .a{grid-column:2}.tf .fx{grid-column:1/3}}
</style>
</head>
<body>
<div class="top">
  <div class="ttl"><i></i><span>§27 · Биология 11</span></div>
  <div class="stages" id="stages"></div>
  <button class="tbtn" onclick="openScore()">🏆 Ұпай</button>
  <button class="tbtn" onclick="fs()">⛶</button>
</div>
<main id="main"></main>
<div class="nav">
  <button class="btn" onclick="go(cur-1)">← Алдыңғы</button>
  <div class="mid" id="navmid"></div>
  <button class="btn dark" onclick="go(cur+1)">Келесі →</button>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="box"><button class="x" onclick="closeM()">×</button><div id="mbody"></div></div></div>

<script src="js/three.min.js"></script>
<script src="js/OrbitControls.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>s;
const G=[["I топ","«Сперматогенез»","1-қатар","#2f7ff0"],["II топ","«Оогенез»","2-қатар","#db2777"],["III топ","«Мейоз»","3-қатар","#16a34a"],["IV топ","«Гаметалар»","4-қатар","#e09a1c"]];
const STG={1:["Сабақтың басы","s1"],2:["Сабақтың ортасы","s2"],3:["Сабақтың соңы","s3"]};

/* ================= SCREENS ================= */
const S=[];
function add(o){S.push(o)}

/* 0 title */
add({id:"home",st:0,title:"Сабақ туралы",render(){
  let acc=0;const rows=S.filter(s=>s.min).map(s=>{const a=acc;acc+=s.min;return `<a href="#${s.id}"><span class="tm">${a}′–${acc}′</span><span><span class="st pill ${STG[s.st][1]}">${STG[s.st][0].split(' ')[1]}</span><b>${s.title}</b>${s.task?' <span class="muted" style="font-size:14px">· тапсырма'+(s.ws?' · ЖП '+s.ws:'')+'</span>':''}</span><span class="mm">${s.min} мин</span></a>`}).join('');
  return `<div class="hd"><div><div class="kicker"><span class="pill">Биология · 11-сынып · 5-тарау «Көбею»</span><span class="pill min">Оқулық: 140–143-беттер, 5.2-сурет</span></div>
  <h1>§27. Сперматогенез бен оогенездің айырмашылықтары</h1><p class="lead">Ашық сабақ. Сабақ ҚМЖ кезеңдері бойынша ретімен өтеді, жалпы ұзақтығы — 45 минут.</p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="materialdar/Zhumys-paraqtary-27.pdf" target="_blank" style="text-decoration:none">📄 Жұмыс парақтары (PDF)</a><button class="btn dark" onclick="go(1)">Сабақты бастау →</button></div></div>
  <div class="layout"><div class="card plan" style="padding:0;overflow:hidden">${rows}<a style="background:var(--ink);color:#fff"><span class="tm" style="color:#9fb0cc">0′–${acc}′</span><b>Барлығы</b><span class="mm">${acc} мин</span></a></div>
  <div class="side"><div class="card"><h3>Оқу мақсаты</h3><p style="margin:0"><b style="font-family:ui-monospace,monospace;color:var(--ac)">11.2.1.2</b> — сперматогенез бен оогенездің айырмашылығын түсіндіру.</p></div>
  <div class="card"><h3>Сабақ мақсаты</h3><p style="margin:0;font-size:16.5px">Сперматогенез бен оогенез үдерістерін салыстырып, ұқсастықтары мен айырмашылықтарын анықтау; мейоздың және гаметалар құрылысының биологиялық маңызын түсіндіру.</p></div>
  <div class="card"><h3>Құндылық</h3><p style="margin:0;font-size:16.5px">Әділдік және жауапкершілік: өз жауабын дәлелдеу, өзгенің пікірін құрметтеу, өз жұмысын әділ бағалау.</p></div></div></div>`}});

/* 1 organization */
add({id:"start",st:1,min:3,title:"Ұйымдастыру. Психологиялық ахуал",render(){
  return head(this,"Сәлемдесу, психологиялық ахуал және топқа бөлу.")+`
  <div class="grid g2"><div class="card"><span class="pill">1-қадам</span><h2 style="margin-top:10px">«n + n = 2n»</h2>
  <p style="margin:0">Әр оқушы өзін бір гамета (<b>n</b>) деп елестетеді. Орнынан тұрмай, жанындағы көршісіне бұрылып, оған бір жылы тілек айтады. Екеуі қосылып, бір «зигота» (<b>2n</b>) түзеді.</p>
  <p class="muted" style="margin:12px 0 0">Мұғалімнің сөзі: «Бір гамета жалғыз жаңа өмір бастай алмайды. Екі гамета бірін-бірі толықтырғанда ғана тіршілік басталады. Бүгін біз де бірін-біріміз толықтырып жұмыс істейміз».</p></div>
  <div class="card"><span class="pill">2-қадам · орыннан тұрмай</span><h2 style="margin-top:10px">Қатар бойынша 4 топ</h2>
  <div class="grid g2" style="gap:10px">${G.map(g=>`<div style="border-left:5px solid ${g[3]};background:var(--bg);border-radius:10px;padding:10px 12px"><b>${g[0]} ${g[1]}</b><div class="muted" style="font-size:15px">${g[2]}</div></div>`).join('')}</div>
  <p class="muted" style="margin:12px 0 0;font-size:16.5px">Әр оқушы өз тобының атауына байланысты бір сөз айтады (мысалы, «Мейоз» тобы: бөліну, гаплоид, кроссинговер...). Сөздер қайталанбайды.</p></div></div>
  <div class="card" style="margin-top:16px;background:var(--ac-s);border-color:#dcdcfb"><b>🔗 Рефлексиямен байланысы:</b> сабақ соңында осы жұптар «Біздің зиготамыз» әдісімен бүгін не үйренгенін бір-біріне айтады.</div>`}});

/* 2 brainstorm */
const BS=[["Неліктен сперматогенез нәтижесінде төрт сперматозоид, ал оогенез нәтижесінде бір ірі жұмыртқа жасушасы түзіледі?","Сперматогенезде цитоплазма тең бөлінеді, төрт жасуша да гаметаға айналады. Оогенезде цитоплазма мен қоректік заттар бір жасушада жиналады, қалғандары полярлы денешіктер болады."],

 function tailUpd(s,t){const pts=[];for(let i=0;i<=24;i++){const u=i/24;pts.push(new THREE.Vector3(-u*1.9,Math.sin(t*9+s.userData.ph-u*7)*.6*u*.65,Math.cos(t*6-u*5)*.6*u*.15))}const tl=s.userData.tail;tl.geometry.dispose();tl.geometry=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),40,.026,8,false)}
 const labs=[];function lab(text,obj,off){const d=document.createElement('div');d.className='lab';d.textContent=text;box.appendChild(d);labs.push({d,obj,off:off||new THREE.Vector3()})}
 let mode='fert',sperms=[],t0=performance.now();

  if(m==='egg'){const e=eggObj(2.2);world.add(e);lab('Ядро',e.children[2],new THREE.Vector3(0,0,0));lab('Цитоплазма (қоректік заттар)',e,new THREE.Vector3(.9,-.7,.6));lab('Фолликулалық жасушалар',e,new THREE.Vector3(.8,1.05,.6));camera.position.set(0,.8,9.5)}
  if(m==='cmp'){for(let i=0;i<4;i++){const s=sperm(1);s.position.set(-4,(1.5-i)*1.1,0);world.add(s);sperms.push(s)}lab('♂ 4 сперматозоид',sperms[3],new THREE.Vector3(0,-1,0));
   const e=eggObj(1.3);e.position.set(2.6,0,0);world.add(e);lab('♀ 1 жұмыртқа жасушасы',e,new THREE.Vector3(0,1.85,0));
   [[4.6,1],[4.9,0],[4.5,-1]].forEach(p=>{const c=cell(0x8e93a8,.25);c.position.set(p[0],p[1],0);world.add(c)});lab('3 полярлы денешік',world.children[world.children.length-1],new THREE.Vector3(.2,-.6,0));camera.position.set(0,.5,11)}
  ctl.target.set(0,0,0);ctl.update()}
 build('fert');
 const v=new THREE.Vector3();
 function loop(){if(!R3)return;R3.raf=requestAnimationFrame(loop);const t=(performance.now()-t0)/1000;
  sperms.forEach((s,i)=>{tailUpd(s,t);if(mode==='fert'){const a=s.userData.a+t*.25,r=s.userData.r;s.position.set(Math.cos(a)*r,s.userData.y+Math.sin(t+i)*.2,Math.sin(a)*r);s.rotation.y=-a-Math.PI/2+Math.PI;s.lookAt(0,s.position.y,0);s.rotateY(-Math.PI/2)}
   if(mode==='cmp')s.position.x=-4+Math.sin(t*1.2+i)*.12});
  world.children.forEach(o=>{if(o.type==='Group'&&mode!=='fert'&&mode!=='sperm'&&mode!=='cmp')o.rotation.y=t*.15});
  ctl.update();renderer.render(scene,camera);
  const w=W(),h=H();labs.forEach(l=>{l.obj.updateMatrixWorld();v.copy(l.off);l.obj.localToWorld?v.applyMatrix4(l.obj.matrixWorld):0;
   if(l.obj.parent&&l.obj.parent.userData&&l.obj.parent.userData.parts){/* part of sperm: off in parent space */}
   v.copy(l.off).add(new THREE.Vector3().setFromMatrixPosition(l.obj.matrixWorld));v.project(camera);l.d.style.left=((v.x+1)/2*w)+'px';l.d.style.top=((1-v.y)/2*h)+'px';l.d.style.display=v.z<1?'block':'none'})}
 function rs(){renderer.setSize(W(),H());camera.aspect=W()/H();camera.updateProjectionMatrix()}addEventListener('resize',rs);
 R3={renderer,build,rs,raf:0,ctl};loop();
}
