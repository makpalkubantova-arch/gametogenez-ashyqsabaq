<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>§27. Сперматогенез бен оогенездің айырмашылықтары</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1240;--ink2:#40386a;--muted:#6f6893;--line:#ebe6fa;--bg:#f6f3ff;
--vi:#6d4aff;--vi2:#9b7bff;--sp:#2f7ff0;--sp-s:#e6f0ff;--oo:#f0a42a;--oo-s:#fff3dd;--ro:#ec4899;--te:#14b8a6;
--ok:#16a34a;--ok-s:#e6f7ec;--bad:#e11d48;--bad-s:#ffe8ee;--r:22px;--sh:0 12px 32px rgba(60,30,140,.08)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:18px;line-height:1.5;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
/* living background */
.bgcells{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(900px 600px at 0% 0%,#e7e0ff 0%,transparent 60%),radial-gradient(800px 600px at 100% 100%,#ffeccc 0%,transparent 55%),radial-gradient(700px 500px at 100% 0%,#dcecff 0%,transparent 55%),var(--bg)}
.bgcells i{position:absolute;border-radius:50%;opacity:.55;animation:float 26s ease-in-out infinite}
.bgcells i::after{content:"";position:absolute;inset:34%;border-radius:50%;background:inherit;filter:brightness(.85)}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}}
/* top */
.top{position:relative;z-index:2;flex:0 0 auto;height:64px;display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(100deg,#1b1240,#3b237f 55%,#5b3bd6);color:#fff;box-shadow:0 6px 20px rgba(27,18,64,.25)}
.logo{display:flex;align-items:center;gap:10px;font-family:Montserrat;font-weight:800;font-size:16px;white-space:nowrap}
.logo svg{width:34px;height:34px}
.stages{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.stg{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:12px;background:rgba(255,255,255,.08);white-space:nowrap}
.stg b{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#c9bfff;margin-right:2px}
.stg.on{background:rgba(255,255,255,.16)}.stg.on b{color:#fff}
.dot{width:13px;height:13px;border-radius:50%;border:none;padding:0;background:rgba(255,255,255,.25)}
.dot.done{background:#a796ff}.dot.on{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.28)}
.tbtn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:11px;padding:8px 13px;font-size:14px;font-weight:700;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.22)}
.tbtn.on{background:#fff;color:var(--ink)}
/* main */
main{position:relative;z-index:1;flex:1;overflow:auto;padding:22px 26px 26px}
.screen{max-width:1400px;margin:0 auto;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.kick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:#efeaff;color:var(--vi)}
.pill.s1{background:#d9f7f2;color:#0f766e}.pill.s2{background:#ece6ff;color:#5b3bd6}.pill.s3{background:#ffefd2;color:#b45309}
.pill.w{background:#fff;color:var(--ink2);border:1px solid var(--line)}
h1{font-family:Montserrat;font-size:38px;line-height:1.12;margin:10px 0 0;letter-spacing:-.01em;background:linear-gradient(90deg,#1b1240,#5b3bd6);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:Montserrat;font-size:22px;margin:0 0 8px}
h3{font-size:18px;margin:0 0 6px}
.muted{color:var(--muted)}
.card{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 18px;font-weight:700;font-size:16px;box-shadow:0 2px 6px rgba(60,30,140,.05);text-decoration:none;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.btn:hover{border-color:#cfc5f5}
.btn.pr{background:linear-gradient(90deg,#5b3bd6,#8a63ff);color:#fff;border:none}
.btn.sm{font-size:14px;padding:8px 13px;border-radius:11px}
/* teacher strip */
.teach{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(90deg,#fff7e6,#fffaf0);border:1px solid #fde3b0;border-radius:18px;padding:12px 16px;margin-bottom:16px}
.teach .ic{flex:0 0 38px;height:38px;border-radius:12px;background:#f0a42a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.teach b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#b45309}
.teach ol{margin:2px 0 0;padding-left:20px;font-size:16px;color:#5b4320}
.teach ol li{margin:1px 0}
body.noteach .teach{display:none}
/* timer */
.timer{background:linear-gradient(150deg,#1b1240,#3b237f);color:#fff;border:none;text-align:center}
.timer .lbl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#c9bfff;font-weight:800}
.timer .ws{display:inline-block;margin-top:6px;font-size:13.5px;font-weight:700;background:rgba(255,255,255,.12);padding:5px 11px;border-radius:9px}
.ring{position:relative;width:190px;height:190px;margin:12px auto 10px}
.ring svg{transform:rotate(-90deg)}
.ring .clk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:50px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer.warn .clk{color:#fcd34d}.timer.end .clk{color:#fb7185;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.timer .ctl{display:flex;gap:8px;justify-content:center}
.timer .ctl button{border:none;border-radius:12px;padding:10px 15px;font-weight:800;font-size:15px;background:rgba(255,255,255,.14);color:#fff}
.timer .ctl button.go{background:#fff;color:var(--ink)}
.who{display:flex;gap:12px}
.who .ic{flex:0 0 44px;height:44px;border-radius:14px;background:#efeaff;display:flex;align-items:center;justify-content:center;font-size:22px}
.who small{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
.desc ul{margin:6px 0 0;padding:0;list-style:none}
.desc li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15.5px;cursor:pointer;user-select:none}
.desc li:last-child{border-bottom:none}
.desc .cb{flex:0 0 22px;height:22px;border:2px solid #c9c1e6;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;margin-top:1px}
.desc li.on .cb{background:var(--ok);border-color:var(--ok)}
.desc .pt{margin-left:auto;font-weight:800;color:var(--vi);white-space:nowrap}
/* reveal */
.rv{display:none;margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--ok-s);color:#14532d;font-size:16.5px}
.open .rv{display:block}
/* tables */
table.t{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;font-size:17px;box-shadow:var(--sh)}
table.t th,table.t td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t tr:last-child td{border-bottom:none}
table.t thead th{background:linear-gradient(90deg,#1b1240,#3b237f);color:#fff;font-weight:700}
td.h{cursor:pointer;color:transparent!important;background:repeating-linear-gradient(135deg,#f6f3ff,#f6f3ff 9px,#efeaff 9px,#efeaff 18px)!important;position:relative;user-select:none}
td.h::after{content:"👆 ашу";position:absolute;left:14px;top:12px;color:#9a90c4;font-size:14px}
td.h.s{color:inherit!important;background:#fff!important;animation:in .3s}td.h.s::after{content:""}
/* qcards */
.qc{position:relative;overflow:hidden}
.qc .n{position:absolute;right:16px;top:8px;font-family:Montserrat;font-size:54px;font-weight:900;color:#efeaff}
.qc p{position:relative;font-weight:700;font-size:19.5px;margin:0 0 14px}
/* tf */
.tf{display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.tf:last-child{border-bottom:none}
.tf .i{width:36px;height:36px;border-radius:11px;background:#efeaff;color:var(--vi);font-weight:800;display:flex;align-items:center;justify-content:center}
.tf .a{display:flex;gap:6px}
.tf .fx{grid-column:2/4;display:none;padding:10px 12px;border-radius:12px;font-size:16.5px}
.tf.d .fx{display:block}.tf.ok .i{background:var(--ok);color:#fff}.tf.no .i{background:var(--bad);color:#fff}
.tf.ok .fx{background:var(--ok-s);color:#14532d}.tf.no .fx{background:var(--bad-s);color:#881337}
/* board: drag & drop */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 18px;font-weight:700;font-size:15.5px}
.tabs button.on{background:linear-gradient(90deg,#5b3bd6,#8a63ff);color:#fff;border-color:transparent}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:66px;padding:14px;border-radius:18px;background:rgba(255,255,255,.7);border:2px dashed #d7cff3;margin-bottom:14px}
.chipc{background:#fff;border:2px solid #e3dcfa;border-radius:14px;padding:10px 14px;font-weight:600;font-size:16.5px;box-shadow:0 4px 10px rgba(60,30,140,.08);cursor:grab;user-select:none;touch-action:none;transition:transform .15s}
.chipc.sel{border-color:var(--vi);box-shadow:0 0 0 4px rgba(109,74,255,.2)}
.chipc.ok{border-color:var(--ok);background:var(--ok-s)}.chipc.no{border-color:var(--bad);background:var(--bad-s)}
.chipc.ghost{position:fixed;z-index:99;pointer-events:none;transform:rotate(-2deg) scale(1.04);opacity:.95}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.zone{min-height:250px;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;border:2px dashed transparent;transition:.15s}
.zone h3{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-family:Montserrat}
.zone.z1{background:var(--sp-s);border-color:#bcd6ff}.zone.z1 h3{color:#1d5fd0}
.zone.z2{background:var(--oo-s);border-color:#fbd79a}.zone.z2 h3{color:#b26b00}
.zone.z3{background:#f1ecff;border-color:#d6caff}.zone.z3 h3{color:#5b3bd6}
.zone.hov{transform:scale(1.01);box-shadow:0 0 0 4px rgba(109,74,255,.18)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:stretch}
.slot{min-height:120px;border-radius:18px;background:rgba(255,255,255,.8);border:2px dashed #cfc5f5;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px;gap:8px;position:relative}
.slot .num{font-family:Montserrat;font-weight:900;color:#d8cff8;font-size:28px}
.slot .fm{font-family:ui-monospace,monospace;font-weight:800;font-size:14px;background:var(--ink);color:#fff;border-radius:7px;padding:2px 8px;display:none}
.slot.ok .fm{display:inline-block}
.slot.hov{border-color:var(--vi);background:#f3efff}
.arrow{display:flex;align-items:center;justify-content:center;color:#b6a9ec;font-size:26px}
.res{margin-top:12px;font-weight:800;font-size:18px}
/* quiz */
.qz{background:linear-gradient(150deg,#1b1240,#3b237f);color:#fff;border-radius:24px;padding:26px;box-shadow:var(--sh)}
.qz .qh{display:flex;justify-content:space-between;align-items:center;color:#c9bfff;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.qz .qq{font-family:Montserrat;font-size:30px;font-weight:800;line-height:1.25;margin:16px 0 20px}
.qz .ops{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qz .op{border:none;border-radius:16px;padding:18px;font-size:21px;font-weight:700;color:#fff;text-align:left;display:flex;gap:12px;align-items:center}
.qz .op span{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.qz .op:nth-child(1){background:#e11d48}.qz .op:nth-child(2){background:#2563eb}.qz .op:nth-child(3){background:#d97706}.qz .op:nth-child(4){background:#16a34a}
.qz.shown .op{opacity:.25}.qz.shown .op.c{opacity:1;box-shadow:0 0 0 4px #fff}
.qz .qt{font-family:Montserrat;font-size:40px;font-weight:900}
.qz .qbar{height:8px;border-radius:4px;background:rgba(255,255,255,.14);margin-top:16px;overflow:hidden}.qz .qbar i{display:block;height:100%;background:#fcd34d}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;margin-bottom:18px}
.hero .ill{position:relative;aspect-ratio:1.25;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 60% 50%,#3b237f,#1b1240 70%);box-shadow:var(--sh)}
.hero .ill svg{position:absolute;inset:0;width:100%;height:100%}
.sw{animation:swim 7s linear infinite}
@keyframes swim{0%{transform:translate(-60px,0)}100%{transform:translate(0,0)}}
.tl{animation:wig .5s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes wig{from{transform:skewY(-8deg)}to{transform:skewY(8deg)}}
.pulse{animation:pul 4s ease-in-out infinite;transform-origin:center}
@keyframes pul{50%{transform:scale(1.035)}}
.plan a{display:grid;grid-template-columns:88px 1fr 64px;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;font-size:16.5px}
.plan a:hover{background:#faf8ff}
.plan .tm{font-family:ui-monospace,monospace;font-size:14px;color:var(--muted)}
.plan .mm{text-align:right;font-weight:800;color:var(--vi)}
.steps{counter-reset:s;list-style:none;margin:6px 0 0;padding:0}
.steps li{counter-increment:s;display:flex;gap:12px;padding:7px 0;font-size:16px}
.steps li::before{content:counter(s);flex:0 0 28px;height:28px;border-radius:9px;background:#efeaff;color:var(--vi);font-weight:800;display:flex;align-items:center;justify-content:center}
/* video & 3d */
.vid{border-radius:24px;overflow:hidden;background:#000;box-shadow:0 20px 50px rgba(27,18,64,.3)}
.vid video{display:block;width:100%;aspect-ratio:16/9}
#v3d{position:relative;height:min(62vh,600px);border-radius:24px;overflow:hidden;background:radial-gradient(800px 500px at 30% 30%,#2b1f6b,transparent 60%),radial-gradient(700px 500px at 80% 75%,#3a2408,transparent 60%),#0b0820}
#v3d canvas{display:block;width:100%;height:100%;touch-action:none}
#v3d .lab{position:absolute;color:#fff;font-size:15px;font-weight:700;background:rgba(11,8,32,.78);border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:9px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-50%)}
/* groups */
.grp{border-top:6px solid var(--g)}
.grp .gl{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--g)}
/* reflection */
.lights{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.light{cursor:pointer;user-select:none;text-align:center}
.light:active{transform:scale(.98)}
.light .bl{width:54px;height:54px;border-radius:50%;margin:0 auto 10px;box-shadow:0 0 30px currentColor}
.light .c{font-family:Montserrat;font-size:46px;font-weight:900}
/* bottom nav */
.nav{position:relative;z-index:2;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:rgba(255,255,255,.92);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.nav .mid{color:var(--muted);font-size:15px;text-align:center}.nav .mid b{color:var(--ink)}
.prog{position:absolute;left:0;top:-3px;height:3px;background:linear-gradient(90deg,#14b8a6,#6d4aff,#f0a42a);transition:width .3s}
/* modal */
.modal{position:fixed;inset:0;background:rgba(27,18,64,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:24px;max-width:980px;width:100%;max-height:86vh;overflow:auto;padding:26px;position:relative}
.modal .x{position:absolute;right:14px;top:12px;border:none;background:#f3f0fb;border-radius:10px;width:38px;height:38px;font-size:20px}
table.sc td,table.sc th{text-align:center;white-space:nowrap}table.sc td:first-child,table.sc th:first-child{text-align:left}
.cellb{min-width:48px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;font-weight:800;font-size:18px}
.minus{border:none;background:none;color:var(--muted);padding:2px 5px;font-size:18px}
.tot{font-family:Montserrat;font-size:26px;font-weight:900}
tr.lead td{background:#fffbeb}
.blank{display:inline-block;min-width:120px;border-bottom:2px solid var(--ink2);text-align:center;font-weight:800;margin:0 4px;cursor:pointer}
.word{border:1px dashed #b9addf;background:#fff;border-radius:10px;padding:7px 14px;margin:4px;font-weight:700}
.word.u{opacity:.3;pointer-events:none}
.mc{display:flex;gap:8px;margin:8px 0 14px}.mc .ok{background:var(--ok);color:#fff;border-color:var(--ok)}.mc .no{background:var(--bad);color:#fff;border-color:var(--bad)}
.keygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.keygrid div{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:#fff}
.keygrid b{font-family:Montserrat;font-size:32px;visibility:hidden;color:var(--vi)}
@media (max-width:1100px){.layout,.hero{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}main{overflow:auto}}
@media (max-width:760px){body{overflow:auto}main{padding:14px}h1{font-size:26px}.g2,.g3,.g4,.cols,.lights,.qz .ops{grid-template-columns:1fr}.slots{grid-template-columns:1fr}.logo span{display:none}.qz .qq{font-size:22px}.tf{grid-template-columns:36px 1fr}.tf .a{grid-column:2}.tf .fx{grid-column:1/3}.keygrid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<div class="bgcells" id="bgcells"></div>
<div class="top">
  <div class="logo"><svg viewBox="0 0 40 40"><circle cx="25" cy="20" r="11" fill="#f0a42a"/><circle cx="25" cy="20" r="4.5" fill="#b26b00"/><ellipse cx="8" cy="20" rx="4" ry="2.6" fill="#9cc8ff"/><path d="M4 20 C1 17,-1 23,-4 20" stroke="#9cc8ff" stroke-width="1.5" fill="none" transform="translate(0,0)"/></svg><span>§27 · Биология 11</span></div>
  <div class="stages" id="stages"></div>

  <button class="tbtn" onclick="fs()">⛶</button>
</div>
<main id="main"></main>

</div>

<script>
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const G=[["I топ","«Сперматогенез»","1-қатар","#2f7ff0"],["II топ","«Оогенез»","2-қатар","#ec4899"],["III топ","«Мейоз»","3-қатар","#14b8a6"],["IV топ","«Гаметалар»","4-қатар","#f0a42a"]];

 if(i===0)$('#tbody').innerHTML=`<div class="card"><h3>Тест кілті (Жұмыс парағы №7)</h3><p class="muted" style="margin:0 0 12px;font-size:16px">Ұяшықты бассаңыз, жауап ашылады.</p><div class="keygrid">${TK.map((k,j)=>`<div onclick="this.querySelector('b').style.visibility='visible'"><div class="muted" style="font-size:14px">${j+1}-сұрақ</div><b>${k}</b></div>`).join('')}</div><button class="btn sm" style="margin-top:12px" onclick="document.querySelectorAll('.keygrid b').forEach(b=>b.style.visibility='visible')">Барлығын ашу</button><p class="muted" style="margin:12px 0 0;font-size:15.5px">9–10 — өте жақсы · 7–8 — жақсы · 5–6 — орташа</p></div>`;
 else{$('#tbody').innerHTML=`<div class="qz" id="qz"></div>`;drawQ()}}
function drawQ(){const z=$('#qz');if(!z)return;const q=QZ[qi];z.className='qz'+(qShown?' shown':'');
 z.innerHTML=`<div class="qh"><span>Сұрақ ${qi+1} / ${QZ.length}</span><span class="qt" id="qt">${qLeft}</span></div><div class="qq">${q[0]}</div><div class="ops">${q[1].map((o,j)=>`<button class="op ${j===q[2]?'c':''}" onclick="qReveal()"><span>${'ABCD'[j]}</span>${o}</button>`).join('')}</div><div class="qbar"><i id="qb" style="width:${qLeft/20*100}%"></i></div>
 <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn sm" onclick="qGo()">${qIv?'⏸ Тоқтату':'▶ 20 секунд'}</button><button class="btn sm" onclick="qReveal()">Жауабы</button><button class="btn sm" onclick="qNext(-1)">←</button><button class="btn sm pr" onclick="qNext(1)">Келесі сұрақ →</button></div>`}
function qGo(){if(qIv){clearInterval(qIv);qIv=null;drawQ();return}qIv=setInterval(()=>{qLeft--;if(qLeft<=0){qLeft=0;clearInterval(qIv);qIv=null;qShown=true;drawQ();return}const e=$('#qt');if(e){e.textContent=qLeft;$('#qb').style.width=(qLeft/20*100)+'%'}},1000);drawQ()}
function qReveal(){qShown=true;clearInterval(qIv);qIv=null;drawQ()}
function qNext(d){qi=(qi+d+QZ.length)%QZ.length;qShown=false;qLeft=20;clearInterval(qIv);qIv=null;drawQ()}

/* ===== timer ===== */
const TM={};
function T(){const s=S[cur];if(!TM[s.id])TM[s.id]={total:s.min*60,left:s.min*60,run:false,end:0};return TM[s.id]}
function tDraw(){const c=$('#clk');if(!c)return;const t=T();if(t.run){t.left=Math.max(0,Math.round((t.end-Date.now())/1000));if(t.left===0)t.run=false}
 c.textContent=String(Math.floor(t.left/60)).padStart(2,'0')+':'+String(t.left%60).padStart(2,'0');
 const C=2*Math.PI*84;$('#rg').setAttribute('stroke-dashoffset',C*(1-t.left/t.total));
 const b=$('#tmr');b.classList.toggle('warn',t.left>0&&t.left<=30);b.classList.toggle('end',t.left===0);
 $('#tgo').textContent=t.run?'⏸ Тоқтату':(t.left===0?'Уақыт бітті':(t.left<t.total?'▶ Жалғастыру':'▶ Бастау'))}
function tStart(){const t=T();if(t.left===0)return;if(t.run){t.run=false;t.left=Math.max(0,Math.round((t.end-Date.now())/1000))}else{t.run=true;t.end=Date.now()+t.left*1000}tDraw()}
function tReset(){const t=T();t.run=false;t.left=t.total;tDraw()}
function tAdd(s){const t=T();t.total+=s;if(t.run)t.end+=s*1000;else t.left+=s;tDraw()}
setInterval(tDraw,250);

/* ===== scoreboard ===== */
const ACT=["Миға шабуыл","Тақта","Оқулық","Жеке","Жұптық","Топтық","ФС","Тест/квиз"];
let SC;try{SC=JSON.parse(localStorage.getItem('sc27b'))}catch(e){}
if(!SC||SC.length!==4||SC[0].length!==ACT.length)SC=G.map(()=>ACT.map(()=>0));
function saveSC(){try{localStorage.setItem('sc27b',JSON.stringify(SC))}catch(e){}}
function boardHTML(){const tot=SC.map(r=>r.reduce((a,b)=>a+b,0)),mx=Math.max(...tot);
 return `<table class="t sc"><thead><tr><th>Топ</th>${ACT.map(a=>`<th>${a}</th>`).join('')}<th>Барлығы</th></tr></thead><tbody>${G.map((g,i)=>`<tr class="${mx>0&&tot[i]===mx?'lead':''}"><td><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${g[3]};margin-right:8px"></span><b>${g[0]}</b> <span class="muted">${g[1]}</span></td>${SC[i].map((v,j)=>`<td><button class="cellb" onclick="sc(${i},${j},1)">${v}</button><button class="minus" onclick="sc(${i},${j},-1)">−</button></td>`).join('')}<td class="tot">${tot[i]}${mx>0&&tot[i]===mx?' 🏆':''}</td></tr>`).join('')}</tbody></table>`}
function sc(i,j,d){SC[i][j]=Math.max(0,SC[i][j]+d);saveSC();document.querySelectorAll('.sc').forEach(t=>t.outerHTML=boardHTML())}
function resetSC(){SC=G.map(()=>ACT.map(()=>0));saveSC();document.querySelectorAll('.sc').forEach(t=>t.outerHTML=boardHTML())}
function openScore(){$('#mbody').innerHTML='<h2>🏆 Ұпай тақтасы</h2><p class="muted" style="margin:0 0 12px">Санды бассаңыз +1 қосылады, «−» батырмасы 1 ұпайды алып тастайды. Жалпы ұпай автоматты түрде есептеледі.</p><div style="overflow-x:auto">'+boardHTML()+'</div><button class="btn sm" style="margin-top:12px" onclick="resetSC()">Нөлдеу</button>';$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
function fs(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}

/* ===== navigation ===== */
let cur=0;
function go(i){i=Math.max(0,Math.min(S.length-1,i));location.hash=S[i].id}
function show(){const h=location.hash.slice(1);let i=S.findIndex(s=>s.id===h);if(i<0)i=0;
 if(S[cur]&&S[cur].onHide)S[cur].onHide();cur=i;const s=S[i];
 $('#main').innerHTML=`<div class="screen">${s.render()}</div>`;$('#main').scrollTop=0;if(s.after)s.after();tDraw();
 $('#stages').innerHTML=[0,1,2,3].map(k=>{const it=S.map((x,j)=>[x,j]).filter(([x])=>x.st===k);const on=it.some(([,j])=>j===cur);
  return `<div class="stg ${on?'on':''}"><b>${k===0?'Кіріспе':STG[k][2]}</b>${it.map(([x,j])=>`<button class="dot ${j===cur?'on':(j<cur?'done':'')}" title="${x.title}" onclick="go(${j})"></button>`).join('')}</div>`}).join('');
 $('#navmid').innerHTML=`<b>${i+1} / ${S.length}</b> · ${s.title}${s.min?` · ${s.min} мин`:''}`;$('#prog').style.width=(i/(S.length-1)*100)+'%'}
addEventListener('hashchange',show);
addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1)});

/* ===== 3D ===== */
let R3=null;
function init3D(){const box=$('#v3d');if(!box||typeof THREE==='undefined')return;
 const W=()=>box.clientWidth,H=()=>box.clientHeight;
 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.setSize(W(),H());renderer.outputEncoding=THREE.sRGBEncoding;box.prepend(renderer.domElement);
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,W()/H(),.1,200);camera.position.set(0,1,11);
 const ctl=new THREE.OrbitControls(camera,renderer.domElement);ctl.enableDamping=true;ctl.minDistance=3;ctl.maxDistance=22;ctl.autoRotate=true;ctl.autoRotateSpeed=.6;
 scene.add(new THREE.HemisphereLight(0xd8ccff,0x20140a,.5));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(4,6,8);scene.add(dl);
 const p1=new THREE.PointLight(0x7b5cff,1.2,40);p1.position.set(-8,2,6);scene.add(p1);const p2=new THREE.PointLight(0xffaa44,1,40);p2.position.set(8,-2,6);scene.add(p2);
 const gc=document.createElement('canvas');gc.width=gc.height=128;{const g=gc.getContext('2d');const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.35,'rgba(255,255,255,.35)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,128,128)}
 const GT=new THREE.CanvasTexture(gc);const world=new THREE.Group();scene.add(world);
 function cell(col,r){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),new THREE.MeshStandardMaterial({color:col,roughness:.45,transparent:true,opacity:.9,emissive:new THREE.Color(col).multiplyScalar(.3)}));
  const n=new THREE.Mesh(new THREE.SphereGeometry(.42,32,24),new THREE.MeshStandardMaterial({color:new THREE.Color(col).multiplyScalar(.5)}));const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:GT,color:col,transparent:true,opacity:.3,blending:THREE.AdditiveBlending,depthWrite:false}));gl.scale.set(3.4,3.4,1);g.add(gl,b,n);g.scale.setScalar(r);return g}
 function eggObj(R){const g=cell(0xf2a93b,1);const z=new THREE.Mesh(new THREE.SphereGeometry(1.08,48,32),new THREE.MeshStandardMaterial({color:0xfff1d0,transparent:true,opacity:.18,depthWrite:false}));g.add(z);
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};const geo=new THREE.SphereGeometry(1,14,10);
  for(let i=0;i<300;i++){const u=rnd()*2-1,th=rnd()*Math.PI*2,s=Math.sqrt(1-u*u),rr=1.14+rnd()*.16;const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.06+rnd()*.04,.75,.55+rnd()*.1),emissive:0x3a1400,emissiveIntensity:.5}));m.position.set(s*Math.cos(th)*rr,s*Math.sin(th)*rr,u*rr);m.scale.setScalar(.045+rnd()*.028);g.add(m)}
  g.scale.setScalar(R);return g}
 function sperm(sc){const g=new THREE.Group();const head=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),new THREE.MeshStandardMaterial({color:0x9cc8ff,roughness:.4,transparent:true,opacity:.92,emissive:0x1d4fa5,emissiveIntensity:.5}));head.scale.set(.3,.19,.19);
  const nuc=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),new THREE.MeshStandardMaterial({color:0x2a5aa8}));nuc.scale.set(.18,.12,.12);nuc.position.x=-.03;
  const ac=new THREE.Mesh(new THREE.SphereGeometry(1,24,16,0,Math.PI*2,0,Math.PI/2.2),new THREE.MeshStandardMaterial({color:0xdff0ff,transparent:true,opacity:.85,emissive:0x2266aa,emissiveIntensity:.4}));ac.scale.set(.195,.165,.195);ac.rotation.z=-Math.PI/2;ac.position.x=.1;
  const mid=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.32,16),new THREE.MeshStandardMaterial({color:0xff9a5a,emissive:0x552200,emissiveIntensity:.5}));mid.rotation.z=Math.PI/2;mid.position.x=-.46;
  const tail=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshStandardMaterial({color:0x8fc0ff,emissive:0x1f4fa0,emissiveIntensity:.5}));tail.position.x=-.6;
  g.add(head,nuc,ac,mid,tail);g.scale.setScalar(sc);g.userData={tail,ph:Math.random()*6,parts:{head,ac,mid,tail,nuc}};return g}
 function tailUpd(s,t){const pts=[];for(let i=0;i<=24;i++){const u=i/24;pts.push(new THREE.Vector3(-u*1.9,Math.sin(t*9+s.userData.ph-u*7)*.6*u*.65,Math.cos(t*6-u*5)*.6*u*.15))}const tl=s.userData.tail;tl.geometry.dispose();tl.geometry=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),40,.026,8,false)}
 const labs=[];function lab(text,obj,off){const d=document.createElement('div');d.className='lab';d.textContent=text;box.appendChild(d);labs.push({d,obj,off:off||new THREE.Vector3()})}
 let mode='fert',sperms=[],t0=performance.now();
 function build(m){mode=m;while(world.children.length)world.remove(world.children[0]);labs.forEach(l=>l.d.remove());labs.length=0;sperms=[];
  if(m==='fert'){const e=eggObj(1.9);world.add(e);lab('Жұмыртқа жасушасы (n)',e,new THREE.Vector3(0,2.6,0));for(let i=0;i<9;i++){const s=sperm(1);s.userData.a=i/9*Math.PI*2;s.userData.r=3.3+(i%3)*.5;s.userData.y=(i%4-1.5)*.9;world.add(s);sperms.push(s)}lab('Сперматозоидтар (n)',sperms[0],new THREE.Vector3(0,.5,0));camera.position.set(0,1.5,11)}
  if(m==='sperm'){const s=sperm(3.4);s.position.x=1.2;world.add(s);sperms.push(s);const P=s.userData.parts;lab('Акросома',P.ac,new THREE.Vector3(.25,.3,0));lab('Ядро',P.nuc,new THREE.Vector3(0,-.32,0));lab('Ортаңғы бөлік (митохондриялар)',P.mid,new THREE.Vector3(0,.35,0));lab('Құйрық',s,new THREE.Vector3(-1.6,-.45,0));camera.position.set(0,1,7.5)}
  if(m==='egg'){const e=eggObj(2.2);world.add(e);lab('Ядро',e.children[2],new THREE.Vector3(0,0,0));lab('Цитоплазма (қоректік заттар)',e,new THREE.Vector3(.9,-.7,.6));lab('Фолликулалық жасушалар',e,new THREE.Vector3(.8,1.05,.6));camera.position.set(0,.8,9.5)}
  if(m==='cmp'){for(let i=0;i<4;i++){const s=sperm(1);s.position.set(-4,(1.5-i)*1.1,0);world.add(s);sperms.push(s)}lab('♂ 4 сперматозоид',sperms[3],new THREE.Vector3(0,-1,0));
   const e=eggObj(1.3);e.position.set(2.6,0,0);world.add(e);lab('♀ 1 жұмыртқа жасушасы',e,new THREE.Vector3(0,1.85,0));
   [[4.6,1],[4.9,0],[4.5,-1]].forEach(p=>{const c=cell(0x8e93a8,.25);c.position.set(p[0],p[1],0);world.add(c)});lab('3 полярлы денешік',world.children[world.children.length-1],new THREE.Vector3(.2,-.6,0));camera.position.set(0,.5,11)}
  ctl.target.set(0,0,0);ctl.update()}
 build('fert');const v=new THREE.Vector3();
 function loop(){if(!R3)return;R3.raf=requestAnimationFrame(loop);const t=(performance.now()-t0)/1000;
  sperms.forEach((s,i)=>{tailUpd(s,t);if(mode==='fert'){const a=s.userData.a+t*.25,r=s.userData.r;s.position.set(Math.cos(a)*r,s.userData.y+Math.sin(t+i)*.2,Math.sin(a)*r);s.lookAt(0,s.position.y,0);s.rotateY(-Math.PI/2)}if(mode==='cmp')s.position.x=-4+Math.sin(t*1.2+i)*.12});
  if(mode==='egg')world.children.forEach(o=>o.rotation.y=t*.15);
  ctl.update();renderer.render(scene,camera);const w=W(),h=H();
  labs.forEach(l=>{l.obj.updateMatrixWorld();v.copy(l.off).add(new THREE.Vector3().setFromMatrixPosition(l.obj.matrixWorld));v.project(camera);l.d.style.left=((v.x+1)/2*w)+'px';l.d.style.top=((1-v.y)/2*h)+'px';l.d.style.display=v.z<1?'block':'none'})}
 function rs(){if(!R3)return;renderer.setSize(W(),H());camera.aspect=W()/H();camera.updateProjectionMatrix()}addEventListener('resize',rs);
 R3={renderer,build,rs,raf:0};loop()}
function stop3D(){if(!R3)return;cancelAnimationFrame(R3.raf);removeEventListener('resize',R3.rs);R3.renderer.dispose();R3=null}
function mode3D(m,b){document.querySelectorAll('#m3tabs button').forEach(x=>x.classList.toggle('on',x===b));if(R3)R3.build(m)}

show();
</script>
